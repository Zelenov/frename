[package]
name = "frename"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Your Name <your.email@example.com>"]
description = "File renaming utility for Windows"

[workspace]
members = [".", "crates/frename-core"]

[features]
# HEIC/HEIF decoding (requires cmake; install cmake then `cargo build --features heic`)
heic = ["dep:libheif-rs"]

[dependencies]
# Core logic crate
frename-core = { path = "crates/frename-core" }

# GUI framework - Iced for cross-platform GUI
iced = { version = "0.14", features = ["tokio", "image"] }

# Video playback - GStreamer-based (requires GStreamer installation on Windows)
# See GSTREAMER_SETUP.md for installation instructions
# Using git version for compatibility with iced 0.14
iced_video_player = { git = "https://github.com/jazzfool/iced_video_player", branch = "master" }
url = "2.5"

# Image decoding (JPEG, PNG, WebP, BMP)
image = "0.25"

# HEIC/HEIF decoding (optional; requires cmake at build time)
libheif-rs = { version = "3", features = ["embedded-libheif"], optional = true }

# Logging - simple file logging for debugging
log = "0.4"
simplelog = "0.12"

# GStreamer bindings - for screenshot frame capture and building the playback pipeline
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"

# Async runtime (spawn_blocking for non-blocking video load)
tokio = { version = "1", features = ["time", "rt"] }

# OS clipboard access (copy filename on Ctrl+C)
arboard = "3"

# Native file/folder picker dialogs
rfd = "0.17"

# Subtitles from speech (Soniox), as a library: no command line parts. Pinned to a commit.
sonisub = { git = "https://github.com/Zelenov/sonisub", rev = "728ed34243f8f71d32096d779dba0ad3d9d9ffc7", default-features = false }
# sonisub's errors, and its progress bars: frename hands it a hidden one (same version as sonisub).
anyhow = "1"
indicatif = "0.18"

# The Soniox API key in the operating system's credential store. keyring has no default store
# and silently falls back to an in-memory mock without one, so each system names its own.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `vendored` builds dbus itself: no libdbus-dev on CI or in the AppImage.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[profile.dev.package."*"]
# Dependencies are rebuilt rarely but run on every frame (text layout, image decode, SQLite,
# shader compilation), so optimise them even in debug builds. Own crates stay at opt-level 0
# so rebuilds stay fast and stepping through app code still works.
opt-level = 3

[profile.release]
opt-level = 3
# Faster release builds in CI while keeping good optimization quality.
lto = "thin"
codegen-units = 8

# Windows subsystem - use "windows" for GUI app (no console), "console" for CLI
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# Make it a Windows GUI app (no console window)
[package.metadata.winres]
