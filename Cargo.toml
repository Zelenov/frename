[package]
name = "frename"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Your Name <your.email@example.com>"]
description = "File renaming utility for Windows"

[workspace]
members = [".", "crates/frename-core"]

[dependencies]
# Core logic crate
frename-core = { path = "crates/frename-core" }
# Describing clips with Claude: frames and subtitles in, a summary and key moments out.
# Pinned to a commit of Zelenov/clipscribe; the library with frames, without its command line.
clipscribe = { git = "https://github.com/Zelenov/clipscribe", rev = "57623d2022dc44639367722296db98f2b0382a02", default-features = false, features = ["frames"] }

# GUI framework - Iced for cross-platform GUI
iced = { version = "0.14", features = ["tokio", "image"] }

# Video playback - GStreamer-based (requires GStreamer installation on Windows)
# See GSTREAMER_SETUP.md for installation instructions
# Using git version for compatibility with iced 0.14
iced_video_player = { git = "https://github.com/jazzfool/iced_video_player", branch = "master" }
url = "2.5"

# Image encoding/decoding: F12 frame screenshots (JPEG), the window icon, demo screenshots
image = "0.25"

# Logging - simple file logging for debugging
log = "0.4"
simplelog = "0.12"

# GStreamer bindings - for screenshot frame capture and building the playback pipeline
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"

# Async runtime (spawn_blocking for non-blocking video load)
tokio = { version = "1", features = ["time", "rt"] }

# OS clipboard access (copy filename on Ctrl+C)
arboard = "3"

# Native file/folder picker dialogs
rfd = "0.17"

# UI translations: Fluent files in i18n/, embedded; fl! checks message ids at compile time
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"

# Installer, portable package and self-update (Windows); versions match `vpk` in the workflows
velopack = "1.2.158"
# Comparing the running version with the newest release
semver = "1"
# Telling network errors from GitHub errors in Velopack's update check (Velopack's own ureq)
ureq = { version = "3", default-features = false }
# Downloads, Desktop and Documents, where an old zip version is looked for
dirs = "6"

# Subtitles from speech (Soniox), as a library: no command line parts.
sonisub = { version = "0.3", default-features = false }
# sonisub's errors, and its progress bars: frename hands it a hidden one (same version as sonisub).
anyhow = "1"
indicatif = "0.18"

[dev-dependencies]
# Parse the .ftl files in the translation tests
fluent-syntax = "0.12"
fluent-bundle = "0.16"
proc-macro2 = "1"

[profile.dev.package."*"]
# Dependencies are rebuilt rarely but run on every frame (text layout, image decode, SQLite,
# shader compilation), so optimise them even in debug builds. Own crates stay at opt-level 0
# so rebuilds stay fast and stepping through app code still works.
opt-level = 3

[profile.release]
opt-level = 3
# Faster release builds in CI while keeping good optimization quality.
lto = "thin"
codegen-units = 8

# Whether another frename from the same install is running before an update
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

# Windows subsystem - use "windows" for GUI app (no console), "console" for CLI
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# Make it a Windows GUI app (no console window)
[package.metadata.winres]
