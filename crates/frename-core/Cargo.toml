[package]
name = "frename-core"
version = "0.1.0"
edition = "2021"
description = "Core logic for frename file renaming utility"

[dependencies]
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["fs", "rt", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xmp_toolkit = "1.12"
toml = "1"
