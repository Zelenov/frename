[package]
name = "frename-core"
version = "0.1.0"
edition = "2021"
description = "Core logic for frename file renaming utility"

[dependencies]
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["fs", "time"] }
uuid = { version = "1", features = ["v4"] }
indexmap = "2"