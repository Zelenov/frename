[package]
name = "frename-core"
version = "0.1.0"
edition = "2021"
description = "Core logic for frename file renaming utility"
license = "MIT"

[dependencies]
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["fs", "rt", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xmp_toolkit = "1.12"
toml = "1"
# AI descriptions (issue #17): the models, languages and descriptions (without GStreamer), and
# the API key in the OS credential store.
clipscribe = { git = "https://github.com/Zelenov/clipscribe", rev = "f822bedf0e18231e7c482da179ace4cf9b2ee03e", default-features = false }
# Reading a Premiere Pro transcript back as subtitles (`.premiere.json`, #219); same version as the root crate.
sonisub = { version = "0.4", default-features = false }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust", "vendored"] }
