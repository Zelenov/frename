[package]
name = "frename-core"
version = "0.1.0"
edition = "2021"
description = "Core logic for frename file renaming utility"

[dependencies]
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["fs", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xmp_toolkit = "1.12"
toml = "1"
# AI descriptions (issue #17): HTTP to the Anthropic API, trusting the OS certificate store
# (corporate TLS-inspecting proxies need it), and the API key in the OS credential store.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust", "vendored"] }
