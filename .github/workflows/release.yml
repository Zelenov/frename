name: Release
run-name: Release - ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["version.md"]

# The GStreamer bundled with frename, in the installer and the Store package alike: as ci.yml.
env:
  GST_VERSION: 1.28.7
  GST_SHA256: 032fc6062b8539838fc8da22589cb9b24c5d820baa7f8cc160af9ea08395badf

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      package_version: ${{ steps.vars.outputs.package_version }}
      name: ${{ steps.vars.outputs.name }}
      draft: ${{ steps.vars.outputs.draft }}
      should_build: ${{ steps.vars.outputs.should_build }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute variables
        id: vars
        run: |
          VERSION=$(sed -n '1s/^#[[:space:]]*//p' version.md | tr -d '[:space:]')
          [ -z "$VERSION" ] && { echo "::error::version.md first line must be '# VERSION'"; exit 1; }
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "::error::version.md heading '$VERSION' is not a version number (unreleased '# NEXT' must be replaced before merging to main)"; exit 1; }
          BRANCH="${{ github.ref_name }}"
          SAFE=$(echo "$BRANCH" | sed 's/\//-/g;s/[^a-zA-Z0-9._-]/-/g;s/-*$//')
          [ -z "$SAFE" ] && SAFE=branch
          if [ "$BRANCH" = main ] || [ "$BRANCH" = master ]; then
            TAG="v$VERSION"; NAME="frename v$VERSION"; DRAFT=false
          else
            TAG="v$VERSION-$SAFE"; NAME="frename v$VERSION - $SAFE"; DRAFT=true
          fi

          if gh release view "$TAG" --repo ${{ github.repository }} 2>/dev/null; then
            EXISTS=true
          else
            EXISTS=false
          fi

          if [ "$DRAFT" = false ] && [ "$EXISTS" = true ] && [ "${{ github.event_name }}" = push ]; then
            echo "::error::Release $TAG already exists. Bump the version in version.md instead of reusing a published one."
            exit 1
          fi
          if [ "$DRAFT" = true ] || [ "$EXISTS" = false ]; then SHOULD_BUILD=true; else SHOULD_BUILD=false; fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Velopack needs 3-part versions: 0.68 -> 0.68.0; 0.68.1 stays.
          case "$VERSION" in
            *.*.*) PACKAGE_VERSION="$VERSION" ;;
            *) PACKAGE_VERSION="$VERSION.0" ;;
          esac
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

          awk '/^# / { if (found) exit; found=1 } found' version.md > release-notes.md
          [ -s release-notes.md ] || echo "See version.md" > release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v6
        if: steps.vars.outputs.should_build == 'true'
        with:
          name: release-notes
          path: release-notes.md

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
      # Only used when the AZURE_* secrets below are set, for OIDC login to Azure Artifact Signing.
      id-token: write
    env:
      # Velopack's packer (matches the crate): as ci.yml.
      VPK_VERSION: 1.2.158
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
      # Code signing (docs/signing-setup.md). Empty when not configured: `if: env.AZURE_CLIENT_ID
      # != ''` steps below then skip and the release builds unsigned, as `secrets` cannot be used
      # directly in `if:` conditions.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v5
        with:
          path: C:\gst-download
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSION }}

      - name: Install GStreamer
        shell: pwsh
        run: packaging/windows/install-gstreamer.ps1 -Version $env:GST_VERSION -Sha256 $env:GST_SHA256 -Dir C:\gstreamer -Download C:\gst-download

      - name: Build release binary
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          Write-Host "Building with APP_VERSION=$env:APP_VERSION"
          cargo build --release --locked

      - name: Bundle GStreamer
        shell: pwsh
        run: packaging/windows/bundle.ps1 -GstRoot C:\gstreamer -Exe target\release\frename.exe -Out dist\frename

      - name: Install vpk
        shell: pwsh
        run: dotnet tool install vpk --version $env:VPK_VERSION --tool-path C:\vpk

      # The previous release's package, so vpk builds a delta update from it. The first release
      # with Velopack has no previous package; the delta is all that is lost.
      - name: Download the previous release
        continue-on-error: true
        shell: pwsh
        run: C:\vpk\vpk.exe download github --repoUrl https://github.com/${{ github.repository }} -o releases

      # Below: code signing with Azure Artifact Signing (docs/signing-setup.md). Skipped entirely
      # when the AZURE_* secrets aren't set — the release then builds unsigned, as before #50.
      - name: Azure login for code signing
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set up .NET for the Azure Artifact Signing dlib
        if: env.AZURE_CLIENT_ID != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Write Azure Artifact Signing metadata
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = [ordered]@{
            Endpoint               = $env:AZURE_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT
            CertificateProfileName = $env:AZURE_SIGNING_PROFILE
          } | ConvertTo-Json
          # vpk's signing dlib requires plain UTF-8, no BOM.
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$pwd\signing-metadata.json", $metadata, $utf8NoBom)

      - name: Pack with Velopack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signArgs = @()
          if ($env:AZURE_CLIENT_ID) { $signArgs = @("--azureTrustedSignFile", "signing-metadata.json") }
          C:\vpk\vpk.exe pack -u frename -v $env:PACKAGE_VERSION -p dist\frename -e frename.exe -o releases --packTitle frename --icon frename-icon.ico @signArgs
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }
          # The portable zip keeps the name every release had (the pipeline checks for it).
          Move-Item releases\frename-win-Portable.zip "releases\frename-windows-x64-v$env:PACKAGE_VERSION.zip"
          Get-ChildItem releases | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Verify code signatures
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found on this runner" }

          # Portable zip layout (docs/design/installer.md "Package layout"): current\frename.exe,
          # Update.exe and a root frename.exe launcher stub.
          $portableDir = "verify-tmp\portable"
          Expand-Archive -Path "releases\frename-windows-x64-v$env:PACKAGE_VERSION.zip" -DestinationPath $portableDir -Force
          $toVerify = @(
            "releases\frename-win-Setup.exe",
            (Join-Path $portableDir "frename.exe"),
            (Join-Path $portableDir "current\frename.exe"),
            (Join-Path $portableDir "Update.exe")
          )

          # The full update package the updater downloads (not the delta one: a delta's payload is
          # a binary patch, not standalone executables, so signtool can't verify it directly).
          $fullNupkg = Get-ChildItem "releases\frename-$env:PACKAGE_VERSION-full.nupkg" -ErrorAction SilentlyContinue
          if (-not $fullNupkg) { throw "Full update package (frename-$env:PACKAGE_VERSION-full.nupkg) not found to verify" }
          $nupkgDir = "verify-tmp\nupkg"
          Copy-Item $fullNupkg.FullName "verify-tmp\full.zip" -Force
          Expand-Archive -Path "verify-tmp\full.zip" -DestinationPath $nupkgDir -Force
          $nupkgExes = Get-ChildItem -Path $nupkgDir -Recurse -Filter "*.exe" | Select-Object -ExpandProperty FullName
          if ($nupkgExes.Count -eq 0) { throw "No executables found inside $($fullNupkg.Name) to verify" }
          $toVerify += $nupkgExes

          foreach ($f in $toVerify) {
            Write-Host "Verifying signature of $f"
            & $signtool verify /pa /v $f
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $f" }
          }

      - name: Signing status
        shell: pwsh
        run: |
          if ($env:AZURE_CLIENT_ID) {
            Add-Content $env:GITHUB_STEP_SUMMARY "Windows build: signed with Azure Artifact Signing."
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY "Windows build: unsigned (code-signing secrets not set; see docs/signing-setup.md)."
          }

      # What the updater reads, the installer and the portable zip; not the previous release's
      # package, nor the legacy RELEASES file (only for Squirrel migrations).
      - uses: actions/upload-artifact@v6
        with:
          name: frename-windows-x64-v${{ needs.prepare.outputs.package_version }}
          path: |
            releases/frename-windows-x64-v${{ needs.prepare.outputs.package_version }}.zip
            releases/frename-win-Setup.exe
            releases/frename-${{ needs.prepare.outputs.package_version }}-*.nupkg
            releases/releases.win.json
            releases/assets.win.json

  # A Windows build that does not install and play video on a clean machine is never published.
  test-windows:
    needs: [prepare, build-windows]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: frename-windows-x64-v${{ needs.prepare.outputs.package_version }}
          path: packages

      - name: Install and self-test on a clean system
        shell: pwsh
        run: packaging/windows/test-package.ps1 -Setup packages\frename-win-Setup.exe -Portable packages\frename-windows-x64-v${{ needs.prepare.outputs.package_version }}.zip

  # The Microsoft Store package (docs/design/microsoft-store.md): the same app built without
  # Velopack's updater, as MSIX. Unsigned: the Store signs it. The GitHub release does not wait
  # for it and does not carry it; submit-store hands it to the Store.
  build-store:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v5
        with:
          path: C:\gst-download
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSION }}

      - name: Install GStreamer
        shell: pwsh
        run: packaging/windows/install-gstreamer.ps1 -Version $env:GST_VERSION -Sha256 $env:GST_SHA256 -Dir C:\gstreamer -Download C:\gst-download

      - name: Build the Store variant
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: cargo build --release --locked --features store

      - name: Bundle GStreamer
        shell: pwsh
        run: packaging/windows/bundle.ps1 -GstRoot C:\gstreamer -Exe target\release\frename.exe -Out dist\frename-store

      # MSIX versions have four parts and the Store needs the last one to be 0: 0.74.0 -> 0.74.0.0.
      - name: Pack the Store package (MSIX)
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: packaging/windows/build-msix.ps1 -Bundle dist\frename-store -Version "${{ needs.prepare.outputs.package_version }}.0" -Out "store\frename-${{ needs.prepare.outputs.package_version }}.0-x64.msix" -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME

      - uses: actions/upload-artifact@v6
        with:
          name: frename-store-msix-v${{ needs.prepare.outputs.package_version }}
          path: store/frename-${{ needs.prepare.outputs.package_version }}.0-x64.msix

  # A Store package that does not install, play video and pass the certification kit on a clean
  # machine is never submitted. Its failure is a Store problem, not a failed GitHub release: the
  # release does not wait for it.
  test-store:
    needs: [prepare, build-store]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: frename-store-msix-v${{ needs.prepare.outputs.package_version }}
          path: store

      - name: Install, self-test and certify the Store package
        shell: pwsh
        run: packaging/windows/test-msix.ps1 -Msix "store\frename-${{ needs.prepare.outputs.package_version }}.0-x64.msix" -Report store\wack-report.xml

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wack-report-v${{ needs.prepare.outputs.package_version }}
          path: store/wack-report.xml
          if-no-files-found: ignore

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install GStreamer and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav patchelf file imagemagick

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build AppImage
        run: |
          version="${{ needs.prepare.outputs.package_version }}"
          packaging/linux/build-appimage.sh "$version" target/release/frename "dist/frename-linux-x86_64-v$version.AppImage"

      - uses: actions/upload-artifact@v6
        with:
          name: frename-linux-x86_64-v${{ needs.prepare.outputs.package_version }}
          path: dist/frename-linux-x86_64-v${{ needs.prepare.outputs.package_version }}.AppImage

  # A Linux build that does not play video on a machine without GStreamer is never published.
  test-linux:
    needs: [prepare, build-linux]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: frename-linux-x86_64-v${{ needs.prepare.outputs.package_version }}
          path: dist

      - name: Self-test on a clean system
        run: packaging/linux/test-appimage.sh dist/frename-linux-x86_64-v${{ needs.prepare.outputs.package_version }}.AppImage

  release:
    needs: [prepare, build-windows, test-windows, build-linux, test-linux]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Only what the release publishes: not the Store package, which may be there already.
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: "{release-notes,frename-windows-x64-v*,frename-linux-x86_64-v*}"
          merge-multiple: true

      - name: Remove existing draft and tag
        if: needs.prepare.outputs.draft == 'true'
        uses: ClementTsang/delete-tag-and-release@v0.4.0
        continue-on-error: true
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          delete_release: true
          repo: ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.name }}
          body_path: artifacts/release-notes.md
          draft: ${{ needs.prepare.outputs.draft }}
          files: |
            artifacts/frename-windows-x64-v${{ needs.prepare.outputs.package_version }}.zip
            artifacts/frename-win-Setup.exe
            artifacts/frename-${{ needs.prepare.outputs.package_version }}-*.nupkg
            artifacts/releases.win.json
            artifacts/assets.win.json
            artifacts/frename-linux-x86_64-v${{ needs.prepare.outputs.package_version }}.AppImage
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Hands the tested Store package to the Microsoft Store as a new submission (docs/store-setup.md,
  # "Automated submissions"). Off until the owner sets the MS_STORE_PRODUCT_ID variable, which is
  # done only after the first submission was made by hand and is live. The listing texts stay as
  # they are in Partner Center; certification takes up to three business days after this.
  submit-store:
    needs: [prepare, test-store, release]
    if: needs.prepare.outputs.draft == 'false' && vars.MS_STORE_PRODUCT_ID != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
      MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
      MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
      MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
      MS_STORE_PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
    steps:
      - name: Check the Store credentials
        run: |
          for name in MS_STORE_TENANT_ID MS_STORE_SELLER_ID MS_STORE_CLIENT_ID MS_STORE_CLIENT_SECRET; do
            [ -n "${!name}" ] || { echo "::error::MS_STORE_PRODUCT_ID is set but the secret $name is not (docs/store-setup.md)"; exit 1; }
          done

      - uses: actions/download-artifact@v7
        with:
          name: frename-store-msix-v${{ needs.prepare.outputs.package_version }}
          path: store

      # Installs Microsoft's msstore command line tool.
      - uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Submit to the Microsoft Store
        run: |
          msstore reconfigure --tenantId "$MS_STORE_TENANT_ID" --sellerId "$MS_STORE_SELLER_ID" \
            --clientId "$MS_STORE_CLIENT_ID" --clientSecret "$MS_STORE_CLIENT_SECRET"
          msstore publish "store/frename-${{ needs.prepare.outputs.package_version }}.0-x64.msix" -id "$MS_STORE_PRODUCT_ID"
          echo "Submitted frename ${{ needs.prepare.outputs.version }} to the Microsoft Store (product $MS_STORE_PRODUCT_ID)." >> "$GITHUB_STEP_SUMMARY"
