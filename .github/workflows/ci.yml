name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The GStreamer bundled with frename on Windows, and Velopack's packer (matches the crate).
  GST_VERSION: 1.28.7
  GST_SHA256: 032fc6062b8539838fc8da22589cb9b24c5d820baa7f8cc160af9ea08395badf
  VPK_VERSION: 1.2.158

jobs:
  linux:
    name: ci-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # version.md's first heading is the release: never `# NEXT`, and on a PR that changes it, newer
      # than the base branch's (so a merge to main always publishes a new version).
      - name: Version heading
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if grep -qE '^#[[:space:]]*NEXT' version.md; then
            echo "::error file=version.md::'# NEXT' is not a version: write the real next version (main's first heading + 1)"; exit 1
          fi
          head_version=$(sed -n '1s/^#[[:space:]]*//p' version.md | tr -d '[:space:]')
          echo "$head_version" | grep -Eq '^[0-9]+\.[0-9]+$' || { echo "::error file=version.md::first line must be '# X.Y', got '$head_version'"; exit 1; }
          if [ -n "$BASE_REF" ]; then
            git fetch --quiet --depth=1 origin "$BASE_REF"
            if ! git diff --quiet FETCH_HEAD -- version.md; then
              base_version=$(git show FETCH_HEAD:version.md | sed -n '1s/^#[[:space:]]*//p' | tr -d '[:space:]')
              newest=$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -t. -k1,1n -k2,2n | tail -1)
              if [ "$newest" != "$head_version" ] || [ "$head_version" = "$base_version" ]; then
                echo "::error file=version.md::version $head_version is not newer than $BASE_REF's $base_version: renumber to the next version"; exit 1
              fi
            fi
          fi

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav xvfb imagemagick mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # With the SONIOX_API_KEY secret set, one test also generates subtitles with the real
      # Soniox (about 30 s of audio); without it that test is skipped (issue #12).
      - name: Test
        run: cargo test --workspace --locked
        env:
          SONIOX_API_KEY: ${{ secrets.SONIOX_API_KEY }}

      - name: Build app
        run: cargo build --locked

      # Opens each clip the way the player does and waits for a decoded frame. No display:
      # the self-test must not need one.
      - name: Self-test
        run: |
          mapfile -t clips < <(grep -v '^#' tests/self-test-clips.txt | grep .)
          ./target/debug/frename --self-test "${clips[@]}"

      - name: Screenshot of the main window
        if: always()
        run: |
          Xvfb :99 -screen 0 1600x900x24 &
          sleep 2
          (cd tests/folder && DISPLAY=:99 ../../target/debug/frename > ../../app.log 2>&1 &)
          sleep 15
          pgrep -x frename || { echo "frename is not running"; cat app.log; exit 1; }
          DISPLAY=:99 import -window root screenshot-main-window.png
          pkill -x frename
          tail -n 20 app.log

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshot-main-window-${{ github.sha }}
          path: screenshot-main-window.png
          retention-days: 14
          if-no-files-found: warn

  # The Linux release build, made the same way release.yml makes it.
  linux-appimage:
    name: ci-linux-appimage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install GStreamer and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav patchelf file imagemagick xvfb mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh 0.0.0-ci target/release/frename dist/frename-0.0.0-ci-x86_64.AppImage

      # The self-test in the next job never opens a window; this checks the AppImage's window.
      - name: Screenshot of the AppImage's main window
        run: |
          Xvfb :99 -screen 0 1600x900x24 &
          sleep 2
          (cd tests/folder && DISPLAY=:99 APPIMAGE_EXTRACT_AND_RUN=1 ../../dist/frename-0.0.0-ci-x86_64.AppImage > ../../appimage.log 2>&1 &)
          sleep 20
          pgrep -f frename-0.0.0-ci || { echo "the AppImage is not running"; cat appimage.log; exit 1; }
          DISPLAY=:99 import -window root screenshot-appimage.png
          pkill -f frename-0.0.0-ci
          tail -n 20 appimage.log

      - uses: actions/upload-artifact@v6
        with:
          name: frename-linux-x86_64-${{ github.sha }}
          path: dist/frename-0.0.0-ci-x86_64.AppImage
          retention-days: 14

      # A separate artifact: sharing one with the AppImage would move the AppImage under dist/dist/.
      - uses: actions/upload-artifact@v6
        with:
          name: screenshot-appimage-${{ github.sha }}
          path: screenshot-appimage.png
          retention-days: 14

  # Plays the test clips with the AppImage on a desktop base that has no GStreamer.
  linux-appimage-test:
    name: ci-linux-appimage-test
    needs: linux-appimage
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: frename-linux-x86_64-${{ github.sha }}
          path: dist

      - name: Self-test on a clean system
        run: packaging/linux/test-appimage.sh dist/frename-0.0.0-ci-x86_64.AppImage

  # Clippy and tests only, kept fast and separate from the release build below so the required
  # ci-windows check does not wait behind packaging (issue #43).
  windows:
    name: ci-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The official package, pinned; the installer (~500 MB) is cached, not the install.
      - uses: actions/cache@v5
        with:
          path: C:\gst-download
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSION }}

      - name: Install GStreamer
        shell: pwsh
        run: packaging/windows/install-gstreamer.ps1 -Version $env:GST_VERSION -Sha256 $env:GST_SHA256 -Dir C:\gstreamer -Download C:\gst-download

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The release build and Windows packaging, in its own job so it runs in parallel with ci-windows
  # instead of behind it (issue #43): on the samples measured, the release build and Velopack pack
  # alone took as long as clippy+test, roughly doubling the Windows critical path when sequential.
  windows-release:
    name: ci-windows-release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The official package, pinned; the installer (~500 MB) is cached, not the install.
      - uses: actions/cache@v5
        with:
          path: C:\gst-download
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSION }}

      - name: Install GStreamer
        shell: pwsh
        run: packaging/windows/install-gstreamer.ps1 -Version $env:GST_VERSION -Sha256 $env:GST_SHA256 -Dir C:\gstreamer -Download C:\gst-download

      - name: Build release
        run: cargo build --release --locked

      - name: Bundle GStreamer
        shell: pwsh
        run: packaging/windows/bundle.ps1 -GstRoot C:\gstreamer -Exe target\release\frename.exe -Out dist\frename

      - name: Pack with Velopack
        shell: pwsh
        run: |
          dotnet tool install vpk --version $env:VPK_VERSION --tool-path C:\vpk
          C:\vpk\vpk.exe pack -u frename -v 0.0.1 -p dist\frename -e frename.exe -o releases --packTitle frename --icon frename-icon.ico
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }
          Get-ChildItem releases | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v6
        with:
          name: frename-windows-packages-${{ github.sha }}
          path: |
            releases/frename-win-Setup.exe
            releases/frename-win-Portable.zip
          retention-days: 14

  # Installs the packages on a fresh runner, which has no GStreamer: the build runner has one on
  # PATH, which would hide a DLL missing from the bundle.
  windows-install:
    name: ci-windows-install
    needs: windows-release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: frename-windows-packages-${{ github.sha }}
          path: packages

      - name: Install and self-test on a clean system
        shell: pwsh
        run: packaging/windows/test-package.ps1 -Setup packages\frename-win-Setup.exe -Portable packages\frename-win-Portable.zip
