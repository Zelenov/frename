name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: ci-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav xvfb imagemagick mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build app
        run: cargo build --locked

      # Opens each clip the way the player does and waits for a decoded frame. No display:
      # the self-test must not need one.
      - name: Self-test
        run: |
          mapfile -t clips < <(grep -v '^#' tests/self-test-clips.txt | grep .)
          ./target/debug/frename --self-test "${clips[@]}"

      - name: Screenshot of the main window
        if: always()
        run: |
          Xvfb :99 -screen 0 1600x900x24 &
          sleep 2
          (cd tests/folder && DISPLAY=:99 ../../target/debug/frename > ../../app.log 2>&1 &)
          sleep 15
          pgrep -x frename || { echo "frename is not running"; cat app.log; exit 1; }
          DISPLAY=:99 import -window root screenshot-main-window.png
          pkill -x frename
          tail -n 20 app.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-main-window-${{ github.sha }}
          path: screenshot-main-window.png
          retention-days: 14
          if-no-files-found: warn

  # The Linux release build, made the same way release.yml makes it.
  linux-appimage:
    name: ci-linux-appimage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav patchelf file imagemagick xvfb mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh 0.0.0-ci target/release/frename dist/frename-0.0.0-ci-x86_64.AppImage

      # The self-test in the next job never opens a window; this checks the AppImage's window.
      - name: Screenshot of the AppImage's main window
        run: |
          Xvfb :99 -screen 0 1600x900x24 &
          sleep 2
          (cd tests/folder && DISPLAY=:99 APPIMAGE_EXTRACT_AND_RUN=1 ../../dist/frename-0.0.0-ci-x86_64.AppImage > ../../appimage.log 2>&1 &)
          sleep 20
          pgrep -f frename-0.0.0-ci || { echo "the AppImage is not running"; cat appimage.log; exit 1; }
          DISPLAY=:99 import -window root screenshot-appimage.png
          pkill -f frename-0.0.0-ci
          tail -n 20 appimage.log

      - uses: actions/upload-artifact@v4
        with:
          name: frename-linux-x86_64-${{ github.sha }}
          path: dist/frename-0.0.0-ci-x86_64.AppImage
          retention-days: 14

      # A separate artifact: sharing one with the AppImage would move the AppImage under dist/dist/.
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-appimage-${{ github.sha }}
          path: screenshot-appimage.png
          retention-days: 14

  # Plays the test clips with the AppImage on a desktop base that has no GStreamer.
  linux-appimage-test:
    name: ci-linux-appimage-test
    needs: linux-appimage
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frename-linux-x86_64-${{ github.sha }}
          path: dist

      - name: Self-test on a clean system
        run: packaging/linux/test-appimage.sh dist/frename-0.0.0-ci-x86_64.AppImage

  windows:
    name: ci-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Configure vendored GStreamer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $base = Join-Path $env:GITHUB_WORKSPACE "vendor\gstreamer"
          $gstRoot = Join-Path $base "minimal_msvc_x86_64"
          if (!(Test-Path $gstRoot)) {
            New-Item -ItemType Directory -Path $base -Force | Out-Null
            Expand-Archive -Path "gstreamer-minimal-msvc-x86_64.zip" -DestinationPath $base -Force
          }
          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig"
          Add-Content $env:GITHUB_ENV "PKG_CONFIG=$gstRoot\bin\pkg-config.exe"
          Add-Content $env:GITHUB_ENV "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot"
          Add-Content $env:GITHUB_PATH "$gstRoot\bin"

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: frename-windows-x64-${{ github.sha }}-needs-system-gstreamer
          path: |
            target/release/frename.exe
            GSTREAMER_SETUP.md
          retention-days: 14
