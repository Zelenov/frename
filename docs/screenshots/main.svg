    <text x="930" y="140" text-anchor="middle">All files</text>
    <text x="1330" y="140" text-anchor="middle">Tags</text>
    <text x="1589" y="140">Searchbar</text>
    <text x="1624" y="368">Starred</text>
    <text x="1595" y="560">All tags</text>
    <text x="1602" y="716">Current video tags</text>
    <text x="1390" y="1028">Comments</text>
    <text x="287" y="1010" text-anchor="end">In</text>
    <text x="405" y="752" text-anchor="end">Subtitles</text>
    <text x="543" y="768">Out</text>
    <text x="416" y="1030">Markers</text>
    <text x="397" y="337" text-anchor="end">Subtitle list</text>
  </g>
  <use xlink:href="#arrow" href="#arrow" transform="translate(1550,228) rotate(148.4)"/>
