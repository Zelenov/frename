<?xml version="1.0" encoding="UTF-8"?>
<!-- README screenshot template: the demo screenshot main.png (main.toml) with labels and arrows.
     The window sits at 100,204 at its real size (1440x720); everything else is in canvas pixels.
     Arrows: see "#arrow" below. Rendered by docs/screenshots/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2020" height="1128" viewBox="0 0 2020 1128">
  <defs>
    <!-- The arrow of the original docs/frename-screenshot.psd: one shape, tip at 0,0, pointing
         right, fading towards the tail. Place it with translate(tip) rotate(direction), and add
         scale(1,-1) to bend it the other way. Never scale it otherwise: every arrow is this size.
         Its tail starts at a corner of the label; its tip stops 10-25 px short of the target. -->
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-122.5" y2="0">
      <stop offset="0" stop-color="#E3E3DC"/>
      <stop offset="0.35" stop-color="#E3E3DC"/>
      <stop offset="1" stop-color="#E3E3DC" stop-opacity="0"/>
    </linearGradient>
    <path id="arrow" fill="url(#fade)"
          d="M0,0 C-17.9,3.1 -37,10.7 -38.8,12.6 C-40.6,14.4 -33.7,2.4 -33.5,-0.3 C-33.3,-3 -88.2,-11 -122.5,0 C-138.8,5.2 -75.4,-25 -29.5,-12.8 C-27.7,-12.3 -27.2,-23.2 -28.8,-26.5 C-30.6,-30.2 1.3,-0.2 0,0 Z"/>
  </defs>
  <rect width="2020" height="1128" fill="#282923"/>
  <image x="100" y="204" width="1440" height="720" xlink:href="main.png" href="main.png"/>
  <g font-family="Segoe UI, Open Sans, sans-serif" font-size="43" fill="#B2B3B8">
