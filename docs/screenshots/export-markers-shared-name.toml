# PR screenshot for #495: `--batch` runs "Export markers to text" on a camera original and its
# proxy of one name, both with markers. The report lists the proxy as left alone, with why. Not a
# README image.
source = "../../tests/folder"
open = "A001.mov"
window = [1440, 720]
panels = [640, 360]
batch_action = "Export markers to text"
batch_run = true
ctrl_click = ["A001.mp4"]

[[files]]
from = "file_example_MP4_480_1_5MG.mp4"
name = "A001.mov"
markers = ["0:02 — Night falls over the ocean"]

[[files]]
from = "file_example_MP4_480_1_5MG.mp4"
name = "A001.mp4"
markers = ["0:06.120 [red] — City lights"]
