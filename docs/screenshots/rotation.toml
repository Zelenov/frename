# Rotation (#66): the open clip turned 90° right, as Ctrl+Alt+→ does, with its note over the
# picture. Not a README image; for looking at the feature (`frename --demo`).
# `--batch` shows the "Rotate videos" action selected.
source = "../../tests/folder"
open = "pick.wide.MVI_0701.mp4"
seek = 2.0
window = [1280, 720]
panels = [460, 320]
rotate = 1
batch_action = "Rotate videos"

[[files]]
from = "file_example_MP4_480_1_5MG.mp4"
name = "pick.wide.MVI_0701.mp4"

