# Multi-select (#60): Ctrl+click MVI_0702 and MVI_0704 (open file MVI_0701 stays selected too),
# then Shift+click MVI_0703, which ranges from the last Ctrl-clicked file (MVI_0704) to it —
# checking 0703 and 0704, and dropping 0701 and 0702. Not a README image; for looking at the
# feature (`frename --demo`).
source = "../../tests/folder"
open = "pick.wide.MVI_0701.mp4"
seek = 2.0
window = [1280, 720]
panels = [460, 320]
ctrl_click = ["review.people.MVI_0702.mp4", "wide.city.MVI_0704.mp4"]
shift_click = "b-roll.city.MVI_0703.webm"

[[files]]
from = "file_example_MP4_480_1_5MG.mp4"
name = "pick.wide.MVI_0701.mp4"

[[files]]
from = "file_example_MOV_480_700kB.mov"
name = "review.people.MVI_0702.mp4"

[[files]]
from = "Short.Travel.Health.Views.file_example_WEBM_480_900KB.webm"
name = "b-roll.city.MVI_0703.webm"

[[files]]
from = "file_example_MP4_480_1_5MG.mp4"
name = "wide.city.MVI_0704.mp4"

[[files]]
from = "file_example_MOV_480_700kB.mov"
name = "skip.handheld.MVI_0705.mov"
